    <style>
        h1 {
            font-family: monospace;
            font-size: 24px;
            font-style: normal;
            font-variant: normal;
            font-weight: 700;
            line-height: 26.4px;
        }

        h3 {
            font-family: monospace;
            font-size: 14px;
            font-style: normal;
            font-variant: normal;
            font-weight: 700;
            line-height: 0px;
        }

        pre json {
            font-family: monospace;
            font-style: normal;
            font-variant: normal;
            background-color: #eee;
            border: 1px solid #999;
            display: block;
            padding: 10px;
        }

        #ws-controls label {
            font-family: monospace;
            font-size: 14px;
            margin-left: 10px;
        }

        #ws-heartbeat-interval {
            width: 4em;
        }

        #ws-status {
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
<h1>Proxy Debug</h1>
<h3>Request</h3>
<pre><json>{{request}}</json></pre>
<h3>Node</h3>
<pre><json>{{node}}</json></pre>
<h3>XP</h3>
<pre><json>{{xp}}</json></pre>
<h3>WebSocket</h3>
<div id="ws-controls">
    <button id="ws-test">Test WebSocket connection</button>
    <button id="ws-close" disabled>Close</button>
    <label><input type="checkbox" id="ws-any-origin"> Allow any origin</label>
    <label><input type="checkbox" id="ws-keep-open"> Keep connection open</label>
    <label><input type="checkbox" id="ws-heartbeat" disabled> Heartbeat every
        <input type="number" id="ws-heartbeat-interval" min="1" value="30" disabled> s</label>
    <label><input type="checkbox" id="ws-heartbeat-ack" disabled> Ack from server</label>
    <label><input type="checkbox" id="ws-no-session-binding"> Disable session binding</label>
</div>
<p id="ws-status"></p>
<pre id="ws-request-block" hidden><json id="ws-request"></json></pre>
<script>
    (function () {
        const testBtn = document.getElementById('ws-test');
        const closeBtn = document.getElementById('ws-close');
        const anyOrigin = document.getElementById('ws-any-origin');
        const keepOpen = document.getElementById('ws-keep-open');
        const heartbeat = document.getElementById('ws-heartbeat');
        const heartbeatInterval = document.getElementById('ws-heartbeat-interval');
        const heartbeatAck = document.getElementById('ws-heartbeat-ack');
        const noSessionBinding = document.getElementById('ws-no-session-binding');
        const status = document.getElementById('ws-status');
        const requestBlock = document.getElementById('ws-request-block');
        const requestOutput = document.getElementById('ws-request');

        let socket;
        let uptimeTimer;
        let heartbeatTimer;
        let userClosed = false;

        function setStatus(text) {
            status.textContent = text;
        }

        function updateHeartbeatControls() {
            heartbeat.disabled = !keepOpen.checked;
            heartbeatInterval.disabled = !keepOpen.checked || !heartbeat.checked;
            heartbeatAck.disabled = !keepOpen.checked || !heartbeat.checked;
        }

        keepOpen.addEventListener('change', updateHeartbeatControls);
        heartbeat.addEventListener('change', updateHeartbeatControls);

        closeBtn.addEventListener('click', function () {
            if (socket) {
                userClosed = true;
                socket.close(1000);
            }
        });

        testBtn.addEventListener('click', function () {
            if (socket) {
                socket.onclose = null;
                socket.close(1000);
                socket = undefined;
            }
            clearInterval(uptimeTimer);
            clearInterval(heartbeatTimer);
            heartbeatTimer = undefined;
            closeBtn.disabled = true;
            userClosed = false;
            requestBlock.hidden = true;
            requestOutput.textContent = '';

            const params = [];
            if (anyOrigin.checked) {
                params.push('allowAnyOrigin=true');
            }
            if (noSessionBinding.checked) {
                params.push('disableSessionBinding=true');
            }
            const useHeartbeat = keepOpen.checked && heartbeat.checked;
            const useAck = useHeartbeat && heartbeatAck.checked;
            if (useAck) {
                params.push('ackHeartbeat=true');
            }
            const url = (location.protocol === 'https:' ? 'wss://' : 'ws://')
                + location.host + '{{wsApiPath}}'
                + (params.length ? '?' + params.join('&') : '');
            const token = 'debug-' + Date.now() + '-' + Math.random().toString(36).slice(2);

            setStatus('Connecting to ' + url + ' …');

            let ws;
            try {
                ws = new WebSocket(url, 'text');
            } catch (e) {
                setStatus('✗ failed: ' + e.message);
                return;
            }
            socket = ws;

            let sentAt;
            let openedAt;
            let received = 0;
            let echoed = false;
            let rtt;
            const pendingHeartbeats = {};
            let heartbeatsSent = 0;
            let acks = 0;
            let ackRtt;

            function heartbeatSummary() {
                return 'heartbeats ' + heartbeatsSent + ' sent'
                    + (useAck ? ', ' + acks + ' acked' : '');
            }

            function connectedStatus() {
                let text = '✓ connected · round-trip ' + rtt + ' ms · open for '
                    + Math.round((Date.now() - openedAt) / 1000) + ' s';
                if (heartbeatTimer) {
                    text += ' · ' + heartbeatSummary()
                        + (ackRtt !== undefined ? ' (last ack ' + ackRtt + ' ms)' : '');
                }
                return text;
            }

            const echoTimeout = setTimeout(function () {
                if (!echoed) {
                    setStatus('✗ failed: no echo within 5 seconds');
                    ws.close();
                }
            }, 5000);

            ws.onopen = function () {
                openedAt = Date.now();
                sentAt = performance.now();
                ws.send(token);
            };

            ws.onmessage = function (event) {
                received++;
                if (received === 1) {
                    requestOutput.textContent = event.data;
                    requestBlock.hidden = false;
                } else if (received === 2) {
                    if (event.data !== token) {
                        setStatus('✗ failed: unexpected echo');
                        ws.close();
                        return;
                    }
                    echoed = true;
                    clearTimeout(echoTimeout);
                    rtt = Math.round(performance.now() - sentAt);
                    if (keepOpen.checked) {
                        closeBtn.disabled = false;
                        if (useHeartbeat) {
                            const seconds = Math.max(1, Number(heartbeatInterval.value) || 30);
                            heartbeatTimer = setInterval(function () {
                                const message = 'heartbeat-' + Date.now();
                                pendingHeartbeats[message] = performance.now();
                                heartbeatsSent++;
                                ws.send(message);
                                setStatus(connectedStatus());
                            }, seconds * 1000);
                        }
                        setStatus(connectedStatus());
                        uptimeTimer = setInterval(function () {
                            setStatus(connectedStatus());
                        }, 1000);
                    } else {
                        setStatus('✓ connected · round-trip ' + rtt + ' ms');
                        ws.close(1000);
                    }
                } else if (event.data.indexOf('ack-') === 0) {
                    const message = event.data.substring('ack-'.length);
                    if (pendingHeartbeats[message] !== undefined) {
                        acks++;
                        ackRtt = Math.round(performance.now() - pendingHeartbeats[message]);
                        delete pendingHeartbeats[message];
                        setStatus(connectedStatus());
                    }
                }
            };

            ws.onclose = function (event) {
                clearTimeout(echoTimeout);
                clearInterval(uptimeTimer);
                clearInterval(heartbeatTimer);
                heartbeatTimer = undefined;
                closeBtn.disabled = true;
                socket = undefined;
                const details = 'code ' + event.code + (event.reason ? ', ' + event.reason : '');
                if (!echoed) {
                    if (received === 0) {
                        setStatus('✗ failed: connection rejected (' + details
                            + ') — an origin check failure shows up here');
                    } else if (status.textContent.indexOf('✗') !== 0) {
                        setStatus('✗ failed: connection closed before echo (' + details + ')');
                    }
                } else if (keepOpen.checked) {
                    const uptime = Math.round((Date.now() - openedAt) / 1000);
                    const heartbeatInfo = heartbeatsSent > 0 ? ', ' + heartbeatSummary() : '';
                    if (userClosed) {
                        setStatus('✓ closed by user after ' + uptime + ' s' + heartbeatInfo);
                    } else if (heartbeatsSent > 0 && !useAck) {
                        setStatus('⚠ connection dropped after ' + uptime + ' s' + heartbeatInfo
                            + ' (' + details + ') — client-to-server heartbeat was not enough;'
                            + ' the proxy may need traffic both ways, try Ack from server');
                    } else if (heartbeatsSent > 0) {
                        setStatus('⚠ connection dropped after ' + uptime + ' s' + heartbeatInfo
                            + ' (' + details + ') — dropped despite heartbeat, likely not an idle timeout');
                    } else {
                        setStatus('⚠ connection dropped after ' + uptime + ' s (' + details
                            + ') — possible proxy idle timeout');
                    }
                }
            };
        });
    })();
</script>
</body>
</html>
