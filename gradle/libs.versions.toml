[versions]
http-client     = "4.0.0"
mustache        = "3.0.0"
junit           = "6.1.3"
enonic-defaults = "2.1.7"

[libraries]
lib-http-client         = { module = "com.enonic.lib:lib-http-client", version.ref = "http-client" }
lib-mustache            = { module = "com.enonic.lib:lib-mustache",    version.ref = "mustache" }
junit-bom               = { module = "org.junit:junit-bom",            version.ref = "junit" }
junit-jupiter           = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
enonic-defaults = { id = "com.enonic.defaults", version.ref = "enonic-defaults" }
